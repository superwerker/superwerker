name: Build and test
on:
  pull_request:
    types:
      - opened
      - edited
      - reopened
      - synchronize
  workflow_dispatch:

# A new push to a pull request makes the run for the previous commit pointless.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  pr-conventions:
    runs-on: ubuntu-latest
    if: ${{ github.actor != 'dependabot[bot]' }}
    steps:
      - name: checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: cdk/yarn.lock
      - name: check PR title
        if: ${{ github.event_name != 'workflow_dispatch' }}
        uses: deepakputhraya/action-pr-title@v1.0.2
        with:
          allowed_prefixes: 'build,chore,ci,docs,feat,fix,perf,refactor,revert,style,test'
      - name: check commit messages
        if: ${{ (github.event_name != 'workflow_dispatch') && (github.ref != 'refs/heads/main') }}
        run: |
          yarn install
          npx commitlint --from ${{ github.event.pull_request.base.sha }} --to ${{ github.event.pull_request.head.sha }} --verbose
        working-directory: cdk

  test:
    runs-on: ubuntu-latest
    needs: pr-conventions
    steps:
      - name: checkout
        uses: actions/checkout@v7
      - name: set up node
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: yarn
          cache-dependency-path: cdk/yarn.lock
      - name: install dependencies
        run: yarn install
        working-directory: cdk
      - name: run tests
        run: yarn test
        working-directory: cdk


